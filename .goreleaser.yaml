# Publica os binários quando uma tag v* é enviada. O workflow
# .github/workflows/release.yml chama este arquivo no CI.
version: 2

project_name: patchlore

builds:
  - id: patchlore
    main: .
    binary: patchlore
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.versao={{ .Version }}

archives:
  - id: padrao
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge pull request"

release:
  prerelease: auto
